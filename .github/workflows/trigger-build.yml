name: 觸發主站部署
# 在本倉庫刷新內容后，觸發主站重新構建部署
# 需要 PAT 以觸發主站的工作流程，請在 Settings > Secrets 中添加 MAIN_SITE_PAT
# PAT 權限需要包含 write contents

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Workflow in main blog repository
        run: |
          # Set the required variables
          repo_owner="ichitenfont"
          repo_name="ichitenfont.github.io"
          event_type="trigger-workflow"
  
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MAIN_SITE_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"repo-source\": \"blog\"}}"
